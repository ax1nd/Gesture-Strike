<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#020617"/>
      <stop offset="100%" stopColor="#1e1020"/>
    </linearGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)" rx="12" stroke="#371b2a" stroke-width="2"/>
  
  <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e" letter-spacing="3" font-weight="bold">GESTURE 02 // BALLISTIC ENGAGEMENT</text>
  <text x="50" y="78" font-family="'Orbitron', sans-serif" font-size="28" fill="#ffffff" font-weight="900" letter-spacing="1">PINCH TRIGGER: PLASMA DISCHARGE</text>

  <!-- Pinching Hand Graphic -->
  <g transform="translate(200, 240)">
    <!-- Bones forming a pinch loop between Thumb and Index -->
    <path d="M 0,110 L 0,40 L -25,10 L -15,-30 L 15,-50" stroke="#f43f5e" stroke-width="4" fill="none" filter="url(#roseGlow)"/> <!-- Thumb curve to pinch -->
    <path d="M 0,40 L 10,0 L 20,-30 L 15,-50" stroke="#f43f5e" stroke-width="4" fill="none" filter="url(#roseGlow)"/> <!-- Index curve to pinch -->
    
    <!-- Other curled fingers -->
    <path d="M 0,40 L 40,20 L 40,-10 L 30,-25" stroke="#475569" stroke-width="2.5" fill="none"/>
    <path d="M 0,40 L 55,25 L 55,0 L 45,-15" stroke="#475569" stroke-width="2.5" fill="none"/>
    <path d="M 0,40 L 70,30 L 70,10 L 60,-5" stroke="#475569" stroke-width="2.5" fill="none"/>

    <!-- Joint Markers -->
    <circle cx="0" cy="110" r="6" fill="#94a3b8"/> <!-- Wrist -->
    <circle cx="-15" cy="-30" r="5" fill="#f43f5e"/> <!-- Thumb IP -->
    <circle cx="20" cy="-30" r="5" fill="#f43f5e"/> <!-- Index DIP -->

    <!-- Contact Convergence Point -->
    <circle cx="15" cy="-50" r="14" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="4,2" filter="url(#roseGlow)"/>
    <circle cx="15" cy="-50" r="7" fill="#ffffff" filter="url(#roseGlow)"/>

    <text x="35" y="-55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb7185" font-weight="bold">PINCH THRESHOLD (d &lt; 0.38)</text>
    <text x="-120" y="-30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">LANDMARK #4 (THUMB)</text>
    <text x="40" y="-28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">LANDMARK #8 (INDEX)</text>
  </g>

  <!-- Laser Projectile Streak -->
  <g transform="translate(420, 190)">
    <!-- Plasma Beam -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" filter="url(#roseGlow)"/>
    <line x1="40" y1="0" x2="300" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Muzzle Flash Rings -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#roseGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>

    <text x="15" y="-22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fb7185" font-weight="bold">PLASMA BOLT VELOCITY: 150 M/S</text>
  </g>

  <!-- Technical Attribute Card -->
  <g transform="translate(440, 260)">
    <rect x="0" y="0" width="310" height="120" rx="6" fill="#090d16" stroke="#371b2a"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f43f5e" font-weight="bold">TRIGGER BEHAVIOR</text>
    <text x="16" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Distance Metric: Euclidean Normalized to Hand Scale</text>
    <text x="16" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Activation: Just-Pressed Edge Detection (&lt; 16ms)</text>
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Hold Mode: Rapid Fire Overdrive Burst</text>
    <text x="16" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Audio Feedback: Procedural Web Audio Synth Chirp</text>
  </g>
</svg>
