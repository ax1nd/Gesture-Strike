<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#020617"/>
      <stop offset="100%" stopColor="#241405"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" rx="12" stroke="#451a03" stroke-width="2"/>
  
  <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b" letter-spacing="3" font-weight="bold">GESTURE 04 // APOCALYPTIC ORDNANCE</text>
  <text x="50" y="78" font-family="'Orbitron', sans-serif" font-size="28" fill="#ffffff" font-weight="900" letter-spacing="1">CLENCHED FIST: NOVA BOMB DETONATION</text>

  <!-- Clenched Fist Wireframe Graphic -->
  <g transform="translate(190, 240)">
    <!-- Curled tightly inwards -->
    <path d="M 0,110 L 0,40 L -20,30 L -15,10" stroke="#f59e0b" stroke-width="4" fill="none" filter="url(#amberGlow)"/> <!-- Thumb -->
    <path d="M 0,40 L -10,0 L 5,-10 L 0,15" stroke="#f59e0b" stroke-width="4" fill="none" filter="url(#amberGlow)"/> <!-- Index Curled -->
    <path d="M 0,40 L 10,-5 L 25,-15 L 15,15" stroke="#f59e0b" stroke-width="4" fill="none" filter="url(#amberGlow)"/> <!-- Middle Curled -->
    <path d="M 0,40 L 25,5 L 40,-5 L 30,20" stroke="#f59e0b" stroke-width="4" fill="none" filter="url(#amberGlow)"/> <!-- Ring Curled -->
    <path d="M 0,40 L 40,15 L 50,5 L 45,25" stroke="#f59e0b" stroke-width="4" fill="none" filter="url(#amberGlow)"/> <!-- Pinky Curled -->

    <!-- Concentrated Core Charge Sphere -->
    <circle cx="10" cy="15" r="28" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2" filter="url(#amberGlow)"/>
    <circle cx="10" cy="15" r="10" fill="#ffffff" filter="url(#amberGlow)"/>

    <text x="-70" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fcd34d" font-weight="bold">TIGHT FIST CLENCH</text>
  </g>

  <!-- Nova Bomb Expanding Shockwave Graphic -->
  <g transform="translate(540, 240)">
    <circle cx="0" cy="0" r="105" stroke="#f59e0b" stroke-width="3.5" fill="none" filter="url(#amberGlow)"/>
    <circle cx="0" cy="0" r="70" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,6" fill="none"/>
    <circle cx="0" cy="0" r="35" stroke="#ffffff" stroke-width="3" fill="#f59e0b" fill-opacity="0.3" filter="url(#amberGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>

    <text x="-90" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24" font-weight="bold">FULL-SCREEN EMP BLAST</text>
  </g>

  <!-- Technical Attribute Card -->
  <g transform="translate(420, 85)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#090d16" stroke="#451a03"/>
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b" font-weight="bold">NOVA BOMB MECHANICS</text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Charge Accumulation: 0.45s sustained clench to 100%</text>
    <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Impact Area: Entire 3D Playfield Void Cleared</text>
    <text x="16" y="74" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Damage Output: 300 AoE + Disintegrates Enemy Bullets</text>
  </g>
</svg>
